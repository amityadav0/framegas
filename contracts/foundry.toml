[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib", "../node_modules"]
solc_version = "0.8.28"
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@forshtat/hegota-support/=../node_modules/@forshtat/hegota-support/",
]
allow_paths = ["../node_modules"]

[fuzz]
runs = 512
